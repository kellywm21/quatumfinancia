name: E2E-Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          echo LITHIC_API_KEY=${{ secrets.LITHIC_API_KEY }} > .env
          echo LITHIC_API_BASE_URL=https://sandbox.lithic.com >> .env
          echo USE_MOCK_LITHIC=true >> .env
          echo JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} >> .env
          echo JWT_ALGORITHM=HS256 >> .env
          echo JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30 >> .env
          echo DATABASE_URL=sqlite:///./payments.db >> .env

      - name: Start API server
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m','src.main' -NoNewWindow -PassThru
          Start-Sleep -Seconds 8

      - name: Run verification script
        shell: pwsh
        run: |
          .\verify_demo.ps1
